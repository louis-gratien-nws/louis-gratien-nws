<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recherche de Films</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="Header">
    <h1>EX'PRESS</h1>
    <form class="search-form" action="recherche.html" method="get">
      <input
        type="text"
        name="query"
        placeholder="Rechercher un film"
        value=""
        required
      />
      <button class="search-btn" type="submit">Rechercher</button>
    </form>
  </header>

  <main class="main-container">
    <h2>Résultats de la recherche</h2>
    <div class="movie-gallery">
      <!-- Les films seront affichés ici -->
    </div>
  </main>

  <footer>
    <p>© 2024 EX'PRESS. Tous droits réservés.</p>
  </footer>

  <script>
    const searchQuery = new URLSearchParams(window.location.search).get("query");

    async function searchMovies(query) {
      try {
        const response = await fetch(`http://localhost:3000/films/search?query=${encodeURIComponent(query)}`);
        if (!response.ok) {
          throw new Error(`Erreur lors de la récupération des films : ${response.statusText}`);
        }

        const movies = await response.json();
        console.log("Résultats de la recherche :", movies);

        const movieGallery = document.querySelector(".movie-gallery");

        // Gérer les cas où aucun film n'est trouvé
        if (movies.length === 0) {
          movieGallery.innerHTML = `<p>Aucun résultat trouvé pour "${query}".</p>`;
          return;
        }

        // Générer le HTML des résultats
        movieGallery.innerHTML = movies
          .map(
            (movie) => `
              <div class="movie-item">
                <a href="film.html?filmId=${movie.id}">
                  <img src="${movie.poster}" alt="${movie.title}" />
                  <p>${movie.title}</p>
                </a>
              </div>
            `
          )
          .join("");
      } catch (error) {
        console.error("Erreur lors de la recherche de films :", error);
        document.querySelector(".movie-gallery").innerHTML = `
          <p>Erreur lors de la recherche de films. Veuillez réessayer plus tard.</p>`;
      }
    }

    // Vérifier si une requête de recherche existe
    if (searchQuery) {
      searchMovies(searchQuery);
    } else {
      document.querySelector(".movie-gallery").innerHTML = "<p>Aucun terme de recherche fourni.</p>";
    }
  </script>
</body>
</html>
