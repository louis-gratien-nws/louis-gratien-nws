<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscription</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="main-container">
      <section name="inscription" class="form-container">
        <h2>Inscription</h2>
        <form>
          <label for="firstname">Prénom</label>
          <input type="text" id="firstname" name="firstname" min="2" max="15" required />

          <label for="lastname">Nom</label>
          <input type="text" id="lastname" name="lastname" min="3" max="20" required />

          <label for="email">Adresse e-mail</label>
          <input type="email" id="email" name="email" required />

          <label for="username">Identifiant</label>
          <input type="text" id="username" name="username" min="4" max="20" required />

          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" min="8" required />

          <label for="confirm-password">Confirmation du mot de passe</label>
          <input type="password" id="confirm-password" name="confirm-password" min="8" required />

          <button type="submit">S'inscrire</button>
        </form>

        <a href="accueil.html">
          <button type="button" class="back-button">Retour</button>
        </a>
      </section>
    </div>
  </body>
</html>
